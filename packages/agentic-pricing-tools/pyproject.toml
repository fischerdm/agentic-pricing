[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-pricing-tools"
version = "0.0.1"
description = "Line-of-business-agnostic building-block utilities for insurance pricing agents."
readme = "README.md"
license = "MIT"
authors = [
    { name = "David Fischer", email = "fischerdm1@outlook.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://agentic-pricing.ai"

# 'agentic_pricing' is a PEP 420 namespace package: src/agentic_pricing/ has no __init__.py.
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/agentic_pricing"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
